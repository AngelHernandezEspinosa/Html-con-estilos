<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Reserva de instalaciones deportivas de Algeciras</title>
    <style>
        body {
            font-family: system-ui;
            margin: 1rem;
            max-width: 600px
        }

        fieldset {
            border: 1px solid #ccc;
            padding: 1rem
        }

        label {
            display: block;
            margin-top: .7rem
        }

        input[type=range] {
            width: 100%
        }
    </style>
</head>

<body>
    <h1>Reserva tu instalación deportiva en Algeciras</h1>

    <form action="#" aria-describedby="ayuda-nivel">
        <fieldset>
            <legend>Datos de reserva deportiva</legend>

            <label>Nombre del solicitante
                <input type="text" name="nombre" required />
            </label>

            <label>Correo electrónico
                <input type="email" name="email" required />
            </label>

            <label>Fecha de la reserva
                <input type="date" name="fecha" required />
            </label>

            <p>Turno de uso de la instalación</p>
            <label><input type="radio" name="turno" value="mañana" required /> Mañana</label>
            <label><input type="radio" name="turno" value="tarde" required /> Tarde</label>

            <label>Nivel deportivo (1 principiante – 10 avanzado)
                <input type="range" name="nivel" min="1" max="10" value="5" aria-describedby="ayuda-nivel" />
            </label>
            <small id="ayuda-nivel">Selecciona tu nivel de experiencia deportiva.</small>

            <label>
                <input type="checkbox" name="seguro" /> Contratar seguro de lesiones
            </label>
        </fieldset>

        <button type="submit">Solicitar reserva</button>
    </form>

    <a href="https://sede.algeciras.es/deportes/inicio">
        Fuente de la noticia real
    </a>
</body>

</html>
